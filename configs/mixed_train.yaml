defaults:
  - data: multimer_refined
  - model/architecture: foldingdit_100M
  - model/sampler: euler_maruyama
  - model/processor: protein_processor
  - model: simplefold
  - _self_
seed: 82301
phase: train  # train | sample | score | preflight | memory_probe | prepare
source_run: null  # sample/score read the resolved config from this training directory
expected_commit: null
model_name: 100M
artifact_root: ${oc.env:SIMPLEFOLD_ARTIFACT_DIR,/pub/ynkim4/ml-simplefold/artifacts}
job_id: ${oc.env:SLURM_JOB_ID}
output_dir: ${artifact_root}/runs/${job_id}
dataset_dir: ${artifact_root}/datasets/synthetic/multimer-refined-v1
general_dataset_dir: ${artifact_root}/datasets/general-finetuning-v1/pdb-mixed-600-seed82301
general_data_config: configs/general_training_data.yaml
selection: configs/datasets/multimer_refined_v1.json
pretrained_checkpoint: ${artifact_root}/checkpoints/simplefold_100M.ckpt
pretrained_sha256: 4cd0b8a0b317a6ab8634444fffd78ce84cfd49c20fe927b83c76c36fda5f54bd
trained_dir: ${artifact_root}/checkpoints/trained/${job_id}
synthetic_probability: 0.1
max_steps: 600
checkpoint_every: 100
checkpoint_save_last: true
save_full_final: true
export_raw: true
activation_checkpointing: false
preflight_receipt: null
general:
  max_tokens: 512
  max_atoms: 4608
evaluation:
  samples: 3
  steps: 500
  tau: 0.3
  seed: 82401
retention:
  enabled: true
model:
  _target_: mixed_training.MixedFineTune
  esm_model: null
  ema_decay: 0.95
  # Keep pilot hyperparameters fixed to measure the effect of mixing data.
  lddt_weight_schedule: false
  processor:
    _target_: mixed_training.FixedESMProcessor
    _partial_: true
    multiplicity: 1
    inference_multiplicity: 1
  architecture:
    esm_model: esm2_3B
  optimizer:
    lr: 1.0e-5
  scheduler:
    warmup_steps: 30
    min_lr: 1.0e-6
    max_lr: ${model.optimizer.lr}
  sample_dir: ${output_dir}/samples
hydra:
  run:
    dir: logs/mixed-training/${job_id}
  job:
    chdir: false
