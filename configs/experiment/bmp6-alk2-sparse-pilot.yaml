# @package _global_
# New target: one baseline and one guided population share initialization/noise.
defaults:
  - override /sampling: bmp6_mapped_sparse

name: bmp6-alk2-sparse-pilot
model: simplefold_3B
fasta: examples/bmp90/BMP6_ACVR1_ACVR2B_observed_core.fasta
num_steps: 500
samples: 10
tau: 0.01
seed: 74101
storage_timeout_seconds: 600

# The sparse spec pins its source coordinates by SHA-256. The scorer reads
# only its declared six distances and FASTA; it does not consume full references.
paths:
  reference_dir: null
  reference_cif: null
  reference_pdb: null
