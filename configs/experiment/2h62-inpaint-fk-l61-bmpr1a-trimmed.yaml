# @package _global_
defaults:
  - override /sampling: 2h62_fk_contacts_l61

name: 2h62-inpaint-fk-l61-bmpr1a-trimmed
model: simplefold_3B
fasta: examples/2h62-inpaint-bmpr1a-trimmed.fasta
num_steps: 500
samples: 10
tau: 0.1
seed: 42
storage_timeout_seconds: 600

paths:
  reference_dir: ${paths.artifact_dir}/datasets/references/2h62-inpaint
  reference_cif: ${paths.reference_dir}/observed.cif
  reference_pdb: ${paths.reference_dir}/observed.pdb

sampling:
  run_baseline: false
  # The existing baseline has full-length BMPR1A and is not a compatible
  # input to this terminal-trim reward. Compare it separately after sampling.
  baseline_prediction_dir: null
  checkpoint_times: [0.30, 0.60, 0.75, 0.90, 0.97]
  reward:
    # Original full-polymer residues 34–117, matching the observed BMPR1A
    # terminal span. Both copies retain original F85/Q86 reward numbering.
    prediction_sequence_spans:
      BMPR1A: [33, 117]
