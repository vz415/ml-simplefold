# Complete candidate catalogs; download PDB examples on demand, cache SwissProt v4 archive.
schema_version: 1
pdb:
  search_url: https://search.rcsb.org/rcsbsearch/v2/query
  structure_url: https://files.rcsb.org/download/{id}.cif
  released_before: '2020-05-01'
  max_resolution: 5.0
  max_chains: 300
  biological_assembly: true
swissprot:
  catalog_url: https://ml-site.cdn-apple.com/models/simplefold/swissprot_list.csv
  archive_url: https://ftp.ebi.ac.uk/pub/databases/alphafold/v4/swissprot_cif_v4.tar
  # Cache the official v4 archive once; extract only the plan's selected .cif.gz members.
cameo:
  provenance: configs/datasets/cameo22_retention_24_v1.json
  targets: 183
  identity: 0.30
  shorter_coverage: 0.70
  open_gap_score: -10.0
  extend_gap_score: -0.5
# First mixed run: experimental PDB general data only, per user choice.
# Set null for uniform sampling over pooled PDB/SwissProt catalogs in a future run.
pdb_probability: 1.0
download_workers: 4
timeout_seconds: 90
download_attempts: 3
max_candidate_attempts: 100
